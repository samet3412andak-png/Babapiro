<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Futbol Quiz</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #061b12, #0b5d3b);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    width: 92%;
    max-width: 650px;
    background: rgba(0,0,0,.35);
    padding: 30px;
    border-radius: 22px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
  }

  h1 { font-size: 42px; margin-top: 0; }
  h2 { margin-bottom: 25px; }

  button {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: 0;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    background: white;
    color: #075b3a;
    transition: .2s;
  }

  button:hover {
    transform: scale(1.03);
    background: #dfffea;
  }

  .option {
    background: #ffffff;
    color: #111;
    text-align: left;
  }

  .correct { background: #32d583 !important; color: white !important; }
  .wrong { background: #ff4d4d !important; color: white !important; }

  .hidden { display: none; }

  #timer {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
  }

  #score {
    font-size: 25px;
    font-weight: bold;
  }
</style>
</head>

<body>

<div class="container">

  <div id="menu">
    <h1>⚽ Futbol Quiz</h1>
    <h2>Kaç soru?</h2>

    <button onclick="setQuestions(10)">10 Soru</button>
    <button onclick="setQuestions(15)">15 Soru</button>
    <button onclick="setQuestions(20)">20 Soru</button>

    <div id="difficulty" class="hidden">
      <h2>Zorluk seç</h2>
      <button onclick="startQuiz('Kolay')">🟢 Kolay</button>
      <button onclick="startQuiz('Normal')">🟡 Normal</button>
      <button onclick="startQuiz('Zor')">🔴 Zor</button>
    </div>
  </div>

  <div id="quiz" class="hidden">
    <div id="progress"></div>
    <div id="timer">⏱️ 15</div>
    <h2 id="question"></h2>
    <div id="answers"></div>
  </div>

  <div id="result" class="hidden">
    <h1>🏆 Quiz Bitti!</h1>
    <p id="score"></p>
    <button onclick="location.reload()">🔄 Tekrar Oyna</button>
  </div>

</div>

<script>
const questions = {
  Kolay: [
    {q:"2022 Dünya Kupası'nı hangi ülke kazandı?", a:["Arjantin","Fransa","Brezilya","Almanya"], c:0},
    {q:"Cristiano Ronaldo hangi ülkedendir?", a:["İspanya","Portekiz","Brezilya","İtalya"], c:1},
    {q:"Lionel Messi hangi ülkedendir?", a:["Arjantin","İspanya","Uruguay","Şili"], c:0},
    {q:"Galatasaray'ın forma rengi nedir?", a:["Sarı-Kırmızı","Mavi-Beyaz","Yeşil-Beyaz","Siyah-Beyaz"], c:0},
    {q:"Şampiyonlar Ligi'nin kupası hangi spordadır?", a:["Basketbol","Tenis","Futbol","Voleybol"], c:2},
    {q:"Bir futbol takımında sahada kaç oyuncu bulunur?", a:["9","10","11","12"], c:2},
    {q:"Dünya Kupası kaç yılda bir düzenlenir?", a:["2","3","4","5"], c:2},
    {q:"Futbolda kaleyi kim korur?", a:["Forvet","Kaleci","Orta saha","Hakem"], c:1},
    {q:"Fenerbahçe'nin renkleri nedir?", a:["Sarı-Lacivert","Kırmızı-Beyaz","Mavi-Siyah","Yeşil-Beyaz"], c:0},
    {q:"Futbolda topu elle oynayabilen oyuncu kimdir?", a:["Forvet","Defans","Kaleci","Orta saha"], c:2}
  ],

  Normal: [
    {q:"2018 Dünya Kupası'nı hangi ülke kazandı?", a:["Fransa","Hırvatistan","Almanya","İspanya"], c:0},
    {q:"Real Madrid'in stadyumunun adı nedir?", a:["Camp Nou","Santiago Bernabéu","Old Trafford","San Siro"], c:1},
    {q:"UEFA Şampiyonlar Ligi'ni en çok kazanan kulüp hangisidir?", a:["Barcelona","Real Madrid","Milan","Liverpool"], c:1},
    {q:"Neymar hangi ülkedendir?", a:["Arjantin","Brezilya","Portekiz","Kolombiya"], c:1},
    {q:"Türkiye'nin 2002 Dünya Kupası'ndaki derecesi nedir?", a:["Şampiyon","Finalist","Üçüncü","Dördüncü"], c:2},
    {q:"Kırmızı kart gören oyuncuya ne olur?", a:["Oyuna devam eder","Oyundan atılır","Penaltı kullanır","Kaptan olur"], c:1},
    {q:"Manchester United'ın stadı hangisidir?", a:["Anfield","Old Trafford","Emirates","Etihad"], c:1},
    {q:"2022 Dünya Kupası finalinde Arjantin kimi yendi?", a:["Brezilya","Fransa","Hollanda","Hırvatistan"], c:1},
    {q:"Liverpool'un stadı hangisidir?", a:["Anfield","Stamford Bridge","Etihad","Villa Park"], c:0},
    {q:"İtalya'nın milli takımının lakabı nedir?", a:["La Roja","Azzurri","Seleção","Les Bleus"], c:1}
  ],

  Zor: [
    {q:"2006 Dünya Kupası'nı hangi ülke kazandı?", a:["İtalya","Fransa","Almanya","Brezilya"], c:0},
    {q:"2013 Ballon d'Or ödülünü kim kazandı?", a:["Messi","Ribéry","Ronaldo","Xavi"], c:2},
    {q:"Şampiyonlar Ligi tarihinde en çok gol atan oyuncu kimdir?", a:["Messi","Ronaldo","Lewandowski","Benzema"], c:1},
    {q:"2005 Şampiyonlar Ligi finalinde Liverpool kimi yendi?", a:["Milan","Chelsea","Barcelona","Juventus"], c:0},
    {q:"2010 Dünya Kupası'nı hangi ülke kazandı?", a:["Almanya","İspanya","Hollanda","İtalya"], c:1},
    {q:"Maradona'nın 1986 Dünya Kupası'nda oynadığı ülke hangisidir?", a:["Arjantin","İtalya","İspanya","Meksika"], c:0},
    {q:"2019 Ballon d'Or'u kim kazandı?", a:["Ronaldo","Messi","Van Dijk","Modric"], c:1},
    {q:"2008 Ballon d'Or ödülünü kim kazandı?", a:["Cristiano Ronaldo","Messi","Kaká","Xavi"], c:0},
    {q:"2014 Dünya Kupası finalinde Almanya kimi yendi?", a:["Arjantin","Brezilya","Hollanda","Fransa"], c:0},
    {q:"1999 Şampiyonlar Ligi finalini hangi takım kazandı?", a:["Bayern Münih","Manchester United","Real Madrid","Barcelona"], c:1}
  ]
};

let questionCount = 10;
let difficulty = "";
let current = 0;
let score = 0;
let quizQuestions = [];
let time = 15;
let timer;

function setQuestions(count) {
  questionCount = count;
  document.getElementById("difficulty").classList.remove("hidden");
}

function startQuiz(level) {
  difficulty = level;
  current = 0;
  score = 0;

  let pool = [...questions[level]];

  while (pool.length < questionCount) {
    pool = pool.concat(questions[level]);
  }

  pool.sort(() => Math.random() - 0.5);
  quizQuestions = pool.slice(0, questionCount);

  document.getElementById("menu").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");

  showQuestion();
}

function showQuestion() {
  clearInterval(timer);

  const q = quizQuestions[current];

  document.getElementById("progress").textContent =
    `Soru ${current + 1} / ${questionCount}`;

  document.getElementById("question").textContent = q.q;

  const answers = document.getElementById("answers");
  answers.innerHTML = "";

  q.a.forEach((answer, index) => {
    const button = document.createElement("button");
    button.className = "option";
    button.textContent = answer;
    button.onclick = () => checkAnswer(index, button);
    answers.appendChild(button);
  });

  time = 15;
  document.getElementById("timer").textContent = `⏱️ ${time}`;

  timer = setInterval(() => {
    time--;
    document.getElementById("timer").textContent = `⏱️ ${time}`;

    if (time <= 0) {
      clearInterval(timer);
      nextQuestion();
    }
  }, 1000);
}

function checkAnswer(index, button) {
  clearInterval(timer);

  const q = quizQuestions[current];
  const buttons = document.querySelectorAll(".option");

  buttons.forEach(b => b.disabled = true);

  if (index === q.c) {
    button.classList.add("correct");
    score++;
  } else {
    button.classList.add("wrong");
    buttons[q.c].classList.add("correct");
  }

  setTimeout(nextQuestion, 800);
}

function nextQuestion() {
  current++;

  if (current >= questionCount) {
    showResult();
  } else {
    showQuestion();
  }
}

function showResult() {
  clearInterval(timer);

  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  const points = score * 100;

  document.getElementById("score").innerHTML =
    `Doğru: ${score} / ${questionCount}<br>🏆 Puan: ${points}`;
}
</script>

</body>
  </html>
